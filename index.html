<script>
// --- ПЕРЕМЕННЫЕ ИНТЕРФЕЙСА ---
const playBtn = document.getElementById('playBtn');
const bpmRange = document.getElementById('bpmRange');
const bpmVal = document.getElementById('bpmVal');
const echoRange = document.getElementById('echoRange');
const echoVal = document.getElementById('echoVal');
const codeSnippet = document.getElementById('codeSnippet');

// --- НАСТРОЙКИ АУДИО ---
let audioCtx = null;
let isPlaying = false;
let sequencerInterval = null;
let currentStep = 0;

// Живые параметры, меняющиеся ползунками
let currentBPM = 120;
let stepTime = 60 / currentBPM / 2;
let echoFeedbackAmount = 0.35;

// Музыкальная матрица
const bassProgression = [
    [55.00, 55.00, 55.00, 55.00, 55.00, 55.00, 55.00, 55.00], // A1
    [43.65, 43.65, 43.65, 43.65, 43.65, 43.65, 43.65, 43.65], // F1
    [65.41, 65.41, 65.41, 65.41, 65.41, 65.41, 65.41, 65.41], // C2
    [49.00, 49.00, 49.00, 49.00, 49.00, 49.00, 49.00, 49.00]  // G1
];

const guitarProgression = [
    [220, 261.63, 329.63, 440, 329.63, 261.63, 329.63, 440],    // Am
    [174.61, 220, 261.63, 349.23, 261.63, 220, 261.63, 349.23], // F
    [261.63, 329.63, 392, 523.25, 392, 329.63, 392, 523.25],    // C
    [196, 246.94, 293.66, 392, 293.66, 246.94, 293.66, 392]     // G
];

let masterVolume, delayNode, delayFeedback;

// --- СЛУШАТЕЛИ ПОЛЗУНКОВ (ЖИВОЕ ИЗМЕНЕНИЕ) ---
bpmRange.addEventListener('input', (e) => {
    currentBPM = parseInt(e.target.value);
    bpmVal.innerText = currentBPM;
    stepTime = 60 / currentBPM / 2; // Пересчитываем время шага на лету!
    
    // Если трек играет, плавно подстраиваем дилей под новый темп
    if (audioCtx && delayNode) {
        delayNode.delayTime.setValueAtTime(60 / currentBPM * 0.75, audioCtx.currentTime);
    }
});

echoRange.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    echoVal.innerText = val;
    echoFeedbackAmount = val / 100;
    
    if (audioCtx && delayFeedback) {
        delayFeedback.gain.setValueAtTime(echoFeedbackAmount, audioCtx.currentTime);
    }
});

// --- СТАРТ / СТОП ---
playBtn.addEventListener('click', () => {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setupFXChain();
    }

    if (!isPlaying) {
        audioCtx.resume();
        currentStep = 0;
        // Запуск через рекурсивный таймер для точной подстройки BPM
        runSequencer();
        playBtn.innerText = "STOP";
        playBtn.classList.add('playing');
        isPlaying = true;
    } else {
        clearTimeout(sequencerInterval);
        playBtn.innerText = "PLAY";
        playBtn.classList.remove('playing');
        isPlaying = false;
    }
});

function runSequencer() {
    playNextStep();
    // Вместо жесткого setInterval используем динамический setTimeout, 
    // чтобы изменения ползунка BPM применялись мгновенно
    sequencerInterval = setTimeout(runSequencer, stepTime * 1000);
}

gain.gain.exponentialRampToValueAtTime(0.01, time + stepTime);
osc.connect(filter); filter.connect(gain); gain.connect(masterVolume);
osc.start(time); osc.stop(time + stepTime);
}
function playGuitarNote(freq, time) {
const osc1 = audioCtx.createOscillator();
const osc2 = audioCtx.createOscillator();
const gain = audioCtx.createGain();
const filter = audioCtx.createBiquadFilter();
osc1.type = 'triangle'; osc1.frequency.setValueAtTime(freq, time);
osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(freq + 1.2, time);
filter.type = 'bandpass'; filter.frequency.setValueAtTime(1000, time); filter.Q.setValueAtTime(1.2, time);
gain.gain.setValueAtTime(0.15, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
osc1.connect(filter); osc2.connect(filter); filter.connect(gain);
gain.connect(masterVolume); gain.connect(delayNode);
osc1.start(time); osc2.start(time);
osc1.stop(time + 0.5); osc2.stop(time + 0.5);
}
// --- ЛОГИКА ШАГОВ ---
function playNextStep() {
const startTime = audioCtx.currentTime + 0.02;
const chordIndex = Math.floor((currentStep / 8) % 4);
const stepInChord = currentStep % 8;
if (stepInChord === 0 || stepInChord === 4) playKick(startTime);
if (stepInChord === 2 || stepInChord === 6) playSnare(startTime);
playHat(startTime);
if (stepInChord !== 3 && stepInChord !== 7) {
const bassFreq = bassProgression[chordIndex][stepInChord];
playBassNote(bassFreq, startTime);
}
const guitarFreq = guitarProgression[chordIndex][stepInChord];
playGuitarNote(guitarFreq, startTime);
currentStep = (currentStep + 1) % 32;
}
// Помещаем актуальный текст скрипта в окно отображения кода
codeSnippet.innerText = document.querySelector('script').innerHTML;
function copyCode() {
navigator.clipboard.writeText(codeSnippet.innerText);
alert('Код скопирован в буфер обмена!');
}
