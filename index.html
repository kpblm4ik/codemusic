<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code;music — Процедурный кайф</title>
    <!-- Подключаем наш внешний файл стилей -->
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <header>
        <h1 class="gradient-text">code;music</h1>
        <p>Архив процедурного аудио. Без авторских прав. Чистый JS.</p>
    </header>

    <main class="catalog">
        <!-- ТРЕК 1: ПОСТ-ПАНК -->
        <div class="track-card">
            <div class="track-header">
                <h2 class="track-title gradient-text">Внутренний Глитч</h2>
                <button class="play-btn" id="playBtn">PLAY</button>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="bpmRange">Темп (BPM): <span id="bpmVal">120</span></label>
                    <input type="range" id="bpmRange" min="60" max="180" value="120">
                </div>
                <div class="control-group">
                    <label for="echoRange">Эхо (Delay): <span id="echoVal">35</span>%</label>
                    <input type="range" id="echoRange" min="0" max="80" value="35">
                </div>
            </div>

            <div class="code-box">
                <button class="copy-btn" onclick="copyCode('codeSnippet')">Copy JS</button>
                <pre id="codeSnippet">// Загрузка аудиодвижка...</pre>
            </div>
        </div>
    </main>

    <footer>
        © 2026 codemusic — сделано мастером-конструктором
    </footer>

<script>
// --- ПЕРЕМЕННЫЕ ИНТЕРФЕЙСА ---
const playBtn = document.getElementById('playBtn');
const bpmRange = document.getElementById('bpmRange');
const bpmVal = document.getElementById('bpmVal');
const echoRange = document.getElementById('echoRange');
const echoVal = document.getElementById('echoVal');
const codeSnippet = document.getElementById('codeSnippet');

// --- НАСТРОЙКИ АУДИО ---
let audioCtx = null;
let isPlaying = false;
let sequencerInterval = null;
let currentStep = 0;

let currentBPM = 120;
let stepTime = 60 / currentBPM / 2;
let echoFeedbackAmount = 0.35;

const bassProgression = [
    [55.00, 55.00, 55.00, 55.00, 55.00, 55.00, 55.00, 55.00], 
    [43.65, 43.65, 43.65, 43.65, 43.65, 43.65, 43.65, 43.65], 
    [65.41, 65.41, 65.41, 65.41, 65.41, 65.41, 65.41, 65.41], 
    [49.00, 49.00, 49.00, 49.00, 49.00, 49.00, 49.00, 49.00]  
];

const guitarProgression = [
    [220, 261.63, 329.63, 440, 329.63, 261.63, 329.63, 440],    
    [174.61, 220, 261.63, 349.23, 261.63, 220, 261.63, 349.23], 
    [261.63, 329.63, 392, 523.25, 392, 329.63, 392, 523.25],    
    [196, 246.94, 293.66, 392, 293.66, 246.94, 293.66, 392]     
];

let masterVolume, delayNode, delayFeedback;

// --- СЛУШАТЕЛИ ИНТЕРФЕЙСА ---
bpmRange.addEventListener('input', (e) => {
    currentBPM = parseInt(e.target.value);
    bpmVal.innerText = currentBPM;
    stepTime = 60 / currentBPM / 2;
    if (audioCtx && delayNode) {
        delayNode.delayTime.setValueAtTime(60 / currentBPM * 0.75, audioCtx.currentTime);
    }
});

echoRange.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    echoVal.innerText = val;
    echoFeedbackAmount = val / 100;
    if (audioCtx && delayFeedback) {
        delayFeedback.gain.setValueAtTime(echoFeedbackAmount, audioCtx.currentTime);
    }
});

playBtn.addEventListener('click', () => {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setupFXChain();
    }

    if (!isPlaying) {
        audioCtx.resume();
        currentStep = 0;
        runSequencer();
        playBtn.innerText = "STOP";
        playBtn.classList.add('playing');
        isPlaying = true;
    } else {
        clearTimeout(sequencerInterval);
        playBtn.innerText = "PLAY";
        playBtn.classList.remove('playing');
        isPlaying = false;
    }
});

function runSequencer() {
    playNextStep();
    sequencerInterval = setTimeout(runSequencer, stepTime * 1000);
}

function setupFXChain() {
    masterVolume = audioCtx.createGain();
    masterVolume.gain.setValueAtTime(0.6, audioCtx.currentTime);

    delayNode = audioCtx.createDelay();
    delayNode.delayTime.setValueAtTime(60 / currentBPM * 0.75, audioCtx.currentTime); 

    delayFeedback = audioCtx.createGain();
    delayFeedback.gain.setValueAtTime(echoFeedbackAmount, audioCtx.currentTime); 

    delayNode.connect(delayFeedback);
    delayFeedback.connect(delayNode);

    masterVolume.connect(audioCtx.destination);
    delayNode.connect(masterVolume);
}

// --- СИНТЕЗАТОРЫ ЗВУКА ---
function playKick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(masterVolume);
    osc.frequency.setValueAtTime(130, time);
    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.12);
    gain.gain.setValueAtTime(1, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
    osc.start(time); osc.stop(time + 0.13);
}

function playSnare(time) {
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle'; osc.connect(oscGain); oscGain.connect(masterVolume);
    osc.frequency.setValueAtTime(180, time);
    oscGain.gain.setValueAtTime(0.7, time);
    oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.08);
    osc.start(time); osc.stop(time + 0.09);

    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'highpass';
    noiseFilter.frequency.setValueAtTime(1200, time);
    const noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(0.35, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterVolume);
    noise.start(time); noise.stop(time + 0.19);
}

function playHat(time) {
    const bufferSize = audioCtx.sampleRate * 0.04;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
    const source = audioCtx.createBufferSource(); source.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass';
    filter.frequency.setValueAtTime(8000, time);
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.1, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
    source.connect(filter); filter.connect(gain); gain.connect(masterVolume);
    source.start(time); source.stop(time + 0.05);
}

function playBassNote(freq, time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, time);
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(350, time);
    gain.gain.setValueAtTime(0.45, time);
    gain.gain.setValueAtTime(0.45, time + stepTime * 0.8);
    gain.gain.exponentialRampToValueAtTime(0.01, time + stepTime);
    osc.connect(filter); filter.connect(gain); gain.connect(masterVolume);
    osc.start(time); osc.stop(time + stepTime);
}

function playGuitarNote(freq, time) {
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator(); 
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    osc1.type = 'triangle'; osc1.frequency.setValueAtTime(freq, time);
    osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(freq + 1.2, time); 
    filter.type = 'bandpass'; filter.frequency.setValueAtTime(1000, time); filter.Q.setValueAtTime(1.2, time);
    gain.gain.setValueAtTime(0.15, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain);
    gain.connect(masterVolume); gain.connect(delayNode);
    osc1.start(time); osc2.start(time);
    osc1.stop(time + 0.5); osc2.stop(time + 0.5);
}

function playNextStep() {
    const startTime = audioCtx.currentTime + 0.02;
    const chordIndex = Math.floor((currentStep / 8) % 4);
    const stepInChord = currentStep % 8;

    if (stepInChord === 0 || stepInChord === 4) playKick(startTime);
    if (stepInChord === 2 || stepInChord === 6) playSnare(startTime);
    playHat(startTime);

    if (stepInChord !== 3 && stepInChord !== 7) {
        const bassFreq = bassProgression[chordIndex][stepInChord];
        playBassNote(bassFreq, startTime);
    }

    const guitarFreq = guitarProgression[chordIndex][stepInChord];
    playGuitarNote(guitarFreq, startTime);

    currentStep = (currentStep + 1) % 32;
}

// Отображаем исходный код
codeSnippet.innerText = document.querySelector('script').innerHTML;

function copyCode(id) {
    const target = document.getElementById(id);
    navigator.clipboard.writeText(target.innerText);
    alert('Код скопирован в буфер обмена!');
}
</script>
</body>
</html>
